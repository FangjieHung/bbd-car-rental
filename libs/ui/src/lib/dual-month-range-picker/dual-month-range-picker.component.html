<div class="block w-full" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <mat-form-field appearance="fill" (click)="open()" class="w-full">
    <mat-label>{{ labels.field }}</mat-label>
    <input
      #triggerInput
      matInput
      readonly
      [value]="displayValue"
      [placeholder]="labels.placeholder"
      aria-haspopup="dialog"
      [attr.aria-expanded]="isOpen"
      (keydown.enter)="openViaKeyboard($event)"
      (keydown.space)="openViaKeyboard($event)"
      (keydown.alt.arrowdown)="openViaKeyboard($event)"
    />
    <span matIconSuffix class="material-symbols-rounded" aria-hidden="true">calendar_month</span>
  </mat-form-field>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="isOpen"
  [cdkConnectedOverlayHasBackdrop]="true"
  [cdkConnectedOverlayDisableClose]="true"
  cdkConnectedOverlayBackdropClass="dual-calendar-backdrop"
  cdkConnectedOverlayPanelClass="dual-calendar-overlay-pane"
  (backdropClick)="close()"
  (attach)="onPanelAttached()"
  (detach)="close()"
>
  <!--
    `cdkConnectedOverlayDisableClose` turns off CDK's own Escape-closes-overlay default so
    `onPanelEscape` below is the single path: it both closes and returns focus to the trigger
    field (see its doc comment). Backdrop click / outside click keep working unchanged — that
    default is separate from `disableClose`, which only gates the Escape-key shortcut.
  -->
  <!--
    tabindex="-1": this div only ever catches Escape bubbling up from a focusable descendant (a
    calendar cell button) — it's never a tab stop and is never focus()'d itself — but the linter's
    `interactive-supports-focus` rule flags any element with a keyboard handler that isn't
    focusable, so it needs an explicit (non-tab-order) tabindex to satisfy that.
  -->
  <div #panel class="dual-calendar-panel" tabindex="-1" (keydown.escape)="onPanelEscape()">
    <!--
      Clearing the hover has to be done here: once the hovered date is folded into `selected`,
      that range has an end, so Material's own leave handler bails out and never reports it.
      Moving between the two panes stays inside this element, so it does not clear spuriously.
    -->
    <div class="calendars-row" (mouseleave)="onHover(null)">
      <div class="calendar-pane">
        <div class="month-head">
          <button type="button" mat-icon-button (click)="goPrev()" [attr.aria-label]="labels.prevMonth">
            <span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>
          </button>
          <span class="month-label">{{ monthLabel(leftMonth) }}</span>
          <span class="head-spacer"></span>
        </div>
        <mat-calendar
          #leftCal
          [startAt]="leftMonth"
          [selected]="selectedRange"
          (selectedChange)="onDateClicked($event)"
        ></mat-calendar>
      </div>

      <div class="calendar-pane">
        <div class="month-head">
          <span class="head-spacer"></span>
          <span class="month-label">{{ monthLabel(rightMonth) }}</span>
          <button type="button" mat-icon-button (click)="goNext()" [attr.aria-label]="labels.nextMonth">
            <span class="material-symbols-rounded" aria-hidden="true">chevron_right</span>
          </button>
        </div>
        <mat-calendar
          #rightCal
          [startAt]="rightMonth"
          [selected]="selectedRange"
          (selectedChange)="onDateClicked($event)"
        ></mat-calendar>
      </div>
    </div>
  </div>
</ng-template>
