<div class="signature-pad">
  <div class="signature-pad__mode-switch" role="group" [attr.aria-label]="labels.drawTab + '/' + labels.typeTab">
    <button
      type="button"
      mat-stroked-button
      class="signature-pad__mode-btn"
      [class.is-active]="mode() === 'draw'"
      [attr.aria-pressed]="mode() === 'draw'"
      (click)="switchMode('draw')"
    >
      {{ labels.drawTab }}
    </button>
    <button
      type="button"
      mat-stroked-button
      class="signature-pad__mode-btn"
      [class.is-active]="mode() === 'type'"
      [attr.aria-pressed]="mode() === 'type'"
      (click)="switchMode('type')"
    >
      {{ labels.typeTab }}
    </button>
  </div>

  @if (mode() === 'draw') {
    <canvas
      #canvas
      class="signature-pad__canvas"
      width="480"
      height="160"
      tabindex="0"
      [attr.aria-label]="labels.canvasAriaLabel"
      (pointerdown)="onPointerDown($event)"
      (pointermove)="onPointerMove($event)"
      (pointerup)="onPointerUp()"
      (pointerleave)="onPointerUp()"
      (pointercancel)="onPointerUp()"
    ></canvas>
    @if (!hasDrawing()) {
      <p class="signature-pad__hint">{{ labels.emptyDrawHint }}</p>
    }
  } @else {
    <mat-form-field class="signature-pad__typed-field">
      <mat-label>{{ labels.typedNameLabel }}</mat-label>
      <input
        matInput
        [value]="typedName()"
        (input)="onTypedNameInputEvent($event)"
        [placeholder]="labels.typedNamePlaceholder"
      />
    </mat-form-field>
  }

  <button type="button" mat-button (click)="clear()" [disabled]="!hasSignatureInput()">
    {{ labels.clear }}
  </button>

  <mat-checkbox [checked]="acknowledged()" (change)="onAcknowledgeChange($event)">
    {{ labels.acknowledge }}
  </mat-checkbox>

  <p class="signature-pad__mock-notice">{{ labels.mockNotice }}</p>

  @if (showConfirmButton()) {
    <button type="button" mat-flat-button [disabled]="!canConfirm()" (click)="confirm()">
      {{ submitting() ? labels.signing : labels.confirmSign }}
    </button>
  }
</div>
