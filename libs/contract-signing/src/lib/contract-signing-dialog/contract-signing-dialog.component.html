<h2 mat-dialog-title class="lib-contract-signing-dialog__title">
  {{ labels.dialog.title }}
  @if (data.version; as version) {
    <span class="lib-contract-signing-dialog__version">{{ labels.document.versionLabel }} {{ version.version }}</span>
  }
</h2>

<mat-dialog-content class="lib-contract-signing-dialog__content">
  @if (data.needsResign) {
    <p class="lib-contract-signing-dialog__notice" role="status">{{ labels.needsResignNotice }}</p>
  }

  <lib-contract-document
    class="lib-contract-signing-dialog__document"
    [snapshot]="data.snapshot"
    [version]="data.version"
  />

  <section class="lib-contract-signing-dialog__signature">
    <lib-signature-pad [showConfirmButton]="false" />
  </section>
</mat-dialog-content>

<mat-dialog-actions align="end" class="lib-contract-signing-dialog__actions">
  <button type="button" mat-button (click)="cancel()">{{ labels.dialog.cancel }}</button>
  <button type="button" mat-flat-button [disabled]="!canConfirm()" (click)="confirm()">
    {{ submitting() ? labels.dialog.signing : labels.dialog.confirm }}
  </button>
</mat-dialog-actions>
