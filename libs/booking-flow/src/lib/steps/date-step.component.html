<div class="date-step">
  <app-dual-month-range-picker
    [start]="startDate"
    [end]="endDate"
    (rangeSelected)="onRangeSelected($event)"
  ></app-dual-month-range-picker>

  <div class="time-row">
    <mat-form-field appearance="outline">
      <mat-label>取車時間</mat-label>
      <input matInput type="time" [(ngModel)]="startTime" />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>還車時間</mat-label>
      <input matInput type="time" [(ngModel)]="endTime" />
    </mat-form-field>
  </div>

  <div class="actions">
    <button mat-flat-button color="primary" [disabled]="!isValid" (click)="confirm()">
      確認租期
    </button>
  </div>
</div>
