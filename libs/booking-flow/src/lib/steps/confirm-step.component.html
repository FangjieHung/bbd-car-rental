<div class="confirm-step">
  <h3>還車地點</h3>
  <mat-form-field appearance="outline">
    <mat-label>還車地點</mat-label>
    <mat-select [ngModel]="form.returnLocation" (ngModelChange)="onReturnLocationChange($event)" name="returnLocation">
      @for (loc of locations; track loc) {
        <mat-option [value]="loc">{{ loc }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <h3>付款人資訊</h3>
  <div class="form-grid">
    <mat-form-field appearance="outline">
      <mat-label>姓名</mat-label>
      <input matInput [(ngModel)]="form.name" name="name" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>電話</mat-label>
      <input matInput [(ngModel)]="form.phone" name="phone" />
    </mat-form-field>
    <mat-form-field appearance="outline">
      <mat-label>Email</mat-label>
      <input matInput type="email" [(ngModel)]="form.email" name="email" />
    </mat-form-field>
  </div>

  <h3>付款方式</h3>
  <mat-radio-group [(ngModel)]="form.paymentMethod" name="paymentMethod">
    @for (method of paymentMethods; track method) {
      <mat-radio-button [value]="method">{{ paymentMethodLabel[method] }}</mat-radio-button>
    }
  </mat-radio-group>

  @if (submitError) {
    <p class="submit-error">{{ submitError }}</p>
  }

  <div class="actions">
    <button mat-flat-button color="primary" [disabled]="!canSubmit" (click)="onSubmit()">
      {{ submitting ? '處理中…' : '前往付款' }}
    </button>
  </div>
</div>
