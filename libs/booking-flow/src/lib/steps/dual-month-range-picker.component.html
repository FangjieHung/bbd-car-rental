<div class="block w-full" cdkOverlayOrigin #origin="cdkOverlayOrigin">
  <mat-form-field appearance="fill" (click)="open()" class="w-full">
    <mat-label>租期</mat-label>
    <input matInput readonly [value]="displayValue" [placeholder]="placeholder" />
    <span matIconSuffix class="material-symbols-rounded" aria-hidden="true">calendar_month</span>
  </mat-form-field>
</div>

<ng-template
  cdkConnectedOverlay
  [cdkConnectedOverlayOrigin]="origin"
  [cdkConnectedOverlayOpen]="isOpen"
  [cdkConnectedOverlayHasBackdrop]="true"
  cdkConnectedOverlayBackdropClass="dual-calendar-backdrop"
  cdkConnectedOverlayPanelClass="dual-calendar-overlay-pane"
  (backdropClick)="close()"
  (detach)="close()"
>
  <div class="dual-calendar-panel">
    <!--
      Clearing the hover has to be done here: once the hovered date is folded into `selected`,
      that range has an end, so Material's own leave handler bails out and never reports it.
      Moving between the two panes stays inside this element, so it does not clear spuriously.
    -->
    <div class="calendars-row" (mouseleave)="onHover(null)">
      <div class="calendar-pane">
        <div class="month-head">
          <button type="button" mat-icon-button (click)="goPrev()" aria-label="上個月">
            <span class="material-symbols-rounded" aria-hidden="true">chevron_left</span>
          </button>
          <span class="month-label">{{ monthLabel(leftMonth) }}</span>
          <span class="head-spacer"></span>
        </div>
        <mat-calendar
          #leftCal
          [startAt]="leftMonth"
          [selected]="selectedRange"
          (selectedChange)="onDateClicked($event)"
        ></mat-calendar>
      </div>

      <div class="calendar-pane">
        <div class="month-head">
          <span class="head-spacer"></span>
          <span class="month-label">{{ monthLabel(rightMonth) }}</span>
          <button type="button" mat-icon-button (click)="goNext()" aria-label="下個月">
            <span class="material-symbols-rounded" aria-hidden="true">chevron_right</span>
          </button>
        </div>
        <mat-calendar
          #rightCal
          [startAt]="rightMonth"
          [selected]="selectedRange"
          (selectedChange)="onDateClicked($event)"
        ></mat-calendar>
      </div>
    </div>
  </div>
</ng-template>
