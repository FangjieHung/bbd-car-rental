<div class="addon-step ui-card">
  <div class="ui-card-header">
    <h2 class="ui-card-title ui-text-title">{{ i18n.t().addOnStep.title }}</h2>
  </div>

  @if (addOns.length === 0) {
    <p class="ui-text-caption">{{ i18n.t().addOnStep.empty }}</p>
  }

  @for (addOn of addOns; track addOn.id) {
    <div class="addon-row">
      <div class="addon-info">
        <span class="addon-info__name">{{ addOn.name }}</span>
        <span class="ui-text-caption">{{ i18n.t().addOnStep.unitPrice(i18n.money(addOn.unitPrice), i18n.t().labels.addOnUnit[addOn.unit]) }}</span>
      </div>
      <mat-form-field appearance="outline" class="qty-field">
        <mat-label>{{ i18n.t().addOnStep.quantity }}</mat-label>
        <input
          matInput
          type="number"
          min="0"
          [ngModel]="qtyOf(addOn.id)"
          (ngModelChange)="onQtyInput(addOn.id, $event)"
        />
      </mat-form-field>
    </div>
  }
</div>
