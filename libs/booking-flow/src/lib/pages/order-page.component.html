<div class="order-page max-w-xl w-full mx-auto">
  @if (partner(); as p) {
    <div class="partner-banner">{{ p.name }} 專屬預約</div>
  }
  <h1 class="order-page__title ui-text-title">填寫訂單</h1>

  <app-search-criteria-bar
    [pickupLocation]="pickupLocation()"
    [startDate]="startDate()"
    [endDate]="endDate()"
    [days]="days()"
    (edit)="goToSearch()"
  ></app-search-criteria-bar>

  <div class="checkout-layout">
    <div class="checkout-main">
      <section class="checkout-section">
        <app-addon-step
          [addOns]="addOns()"
          [addOnQty]="addOnQty()"
          (addOnQtyChange)="onAddOnQtyChange($event.addOnId, $event.qty)"
        ></app-addon-step>
      </section>

      <section class="checkout-section">
        <app-coupon-step
          [couponCode]="couponCode()"
          [couponResult]="couponResult()"
          [priceBreakdown]="priceBreakdown()"
          (couponCodeChange)="onCouponCodeChange($event)"
        ></app-coupon-step>
      </section>

      <section class="checkout-section">
        <app-confirm-step
          [vehicle]="vehicle()"
          [startDate]="startDate()"
          [endDate]="endDate()"
          [selectedAddOnLines]="selectedAddOnLines()"
          [priceBreakdown]="priceBreakdown()"
          [submitting]="submitting()"
          [submitError]="submitError()"
          (confirm)="onConfirmSubmit($event)"
        ></app-confirm-step>
      </section>
    </div>

    <aside class="checkout-aside">
      <app-order-summary-card
        [vehicle]="vehicle()"
        [startDate]="startDate()"
        [endDate]="endDate()"
        [returnLocation]="vehicle()?.location ?? ''"
        [selectedAddOnLines]="selectedAddOnLines()"
        [priceBreakdown]="priceBreakdown()"
      ></app-order-summary-card>
    </aside>
  </div>
</div>
