<div class="order-page max-w-6xl w-full mx-auto p-4 sm:p-6">
  @if (partner(); as p) {
    <div class="partner-banner">{{ i18n.t().common.partnerBanner(p.name) }}</div>
  }
  <h1 class="order-page__title ui-text-title">{{ i18n.t().order.title }}</h1>

  <lib-search-criteria-bar
    [pickupBranchId]="pickupBranchId()"
    [startDate]="startDate()"
    [endDate]="endDate()"
    [days]="days()"
    (edit)="goToSearch()"
  ></lib-search-criteria-bar>

  <div class="checkout-layout">
    <div class="checkout-main">
      <section class="checkout-section">
        <lib-addon-step
          [addOns]="addOns()"
          [addOnQty]="addOnQty()"
          (addOnQtyChange)="onAddOnQtyChange($event.addOnId, $event.qty)"
        ></lib-addon-step>
      </section>

      <section class="checkout-section">
        <lib-coupon-step
          [couponCode]="couponCode()"
          [couponResult]="couponResult()"
          [priceBreakdown]="priceBreakdown()"
          (couponCodeChange)="onCouponCodeChange($event)"
        ></lib-coupon-step>
      </section>

      <section class="checkout-section">
        <lib-confirm-step
          [vehicle]="vehicle()"
          [startDate]="startDate()"
          [endDate]="endDate()"
          [selectedAddOnLines]="selectedAddOnLines()"
          [priceBreakdown]="priceBreakdown()"
          [submitting]="submitting()"
          [submitError]="submitError()"
          (confirm)="onConfirmSubmit($event)"
        ></lib-confirm-step>
      </section>
    </div>

    <aside class="checkout-aside">
      <lib-order-summary-card
        [vehicle]="vehicle()"
        [startDate]="startDate()"
        [endDate]="endDate()"
        [selectedAddOnLines]="selectedAddOnLines()"
        [priceBreakdown]="priceBreakdown()"
      ></lib-order-summary-card>
    </aside>
  </div>
</div>
