<nav class="language-switcher" [attr.aria-label]="i18n.t().language.label">
  <span class="material-symbols-rounded language-switcher__icon" aria-hidden="true">language</span>
  @for (option of locales; track option.locale) {
    <button
      type="button"
      class="language-switcher__option"
      [class.language-switcher__option--active]="i18n.locale() === option.locale"
      [attr.aria-pressed]="i18n.locale() === option.locale"
      [attr.lang]="option.htmlLang"
      (click)="i18n.setLocale(option.locale)"
    >
      {{ option.nativeName }}
    </button>
  }
</nav>
