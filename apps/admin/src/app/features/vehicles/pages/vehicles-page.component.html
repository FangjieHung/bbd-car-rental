<div>
  <ng-template appHeaderToolbar>
    <app-page-toolbar
      [(query)]="searchQuery"
      [placeholder]="t.common.search"
      [activeFilterCount]="activeFilterCount()"
      (clearAll)="clearFilters()"
    >
      <app-filter-select
        filters
        [label]="t.vehicle.type"
        [options]="typeOptions"
        [(value)]="typeFilter"
      />
      <app-filter-select
        filters
        [label]="t.vehicle.status"
        [options]="statusOptions"
        [(value)]="statusFilter"
      />
      <button actions class="flex-auto" mat-flat-button (click)="openForm(null)">
        <span class="material-symbols-rounded" aria-hidden="true">directions_car</span>
        {{ t.common.create }}{{ t.vehicle.vehicle }}
      </button>
    </app-page-toolbar>
  </ng-template>

  <nav class="ui-card-titleNav mb-2" aria-label="車輛清單顯示方式">
    <button
      type="button"
      class="ui-card-titleNav__item"
      [class.is-active]="viewMode() === 'table'"
      [attr.aria-pressed]="viewMode() === 'table'"
      (click)="viewMode.set('table')"
    >
      <span class="material-symbols-rounded" aria-hidden="true">table_rows</span>
      <span>{{ t.vehicle.tableView }}</span>
    </button>
    <button
      type="button"
      class="ui-card-titleNav__item"
      [class.is-active]="viewMode() === 'timeline'"
      [attr.aria-pressed]="viewMode() === 'timeline'"
      (click)="viewMode.set('timeline')"
    >
      <span class="material-symbols-rounded" aria-hidden="true">view_timeline</span>
      <span>{{ t.vehicle.timelineView }}</span>
    </button>
  </nav>

  @if (store.vehicles().length === 0) {
    <p class="empty-state">{{ t.common.empty }}</p>
  } @else {
    @if (filteredVehicles().length === 0) {
      <p class="empty-state">{{ t.common.noResults }}</p>
    } @else if (viewMode() === 'timeline') {
      <app-timeline-view [vehicles]="filteredVehicles()" />
    } @else {
      <div class="ui-card !p-0">
        <lib-data-table
          [columns]="columns"
          [rows]="filteredVehicles()"
          [labels]="labels"
          [selectable]="true"
          [selection]="selectedVehicles()"
          [emptyText]="t.common.empty"
          exportName="vehicles"
          (selectionChange)="selectedVehicles.set($event)"
          (batchDelete)="removeSelected($event)"
          (exportFailed)="onExportFailed($event)"
        >
          <ng-template dtCell="category" let-v>{{ t.vehicle.typeLabels[v.category] }}</ng-template>
          <ng-template dtCell="status" let-v>
            <app-status-chip [label]="t.vehicle.statusLabels[v.status]" [status]="statusKeyOf(v)" />
          </ng-template>
          <ng-template dtCell="actions" let-v>
            <button mat-button (click)="openForm(v)">{{ t.common.edit }}</button>
            <button mat-button color="warn" (click)="remove(v)">{{ t.common.delete }}</button>
          </ng-template>
        </lib-data-table>
      </div>
    }
  }
</div>
