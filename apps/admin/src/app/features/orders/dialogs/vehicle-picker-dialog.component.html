<h2 mat-dialog-title>{{ t.order.pickVehicle }}</h2>
<mat-dialog-content>
  <p class="mb-2 text-sm opacity-70">{{ fmt(range.startDateTime) }} — {{ fmt(range.endDateTime) }}</p>
  @if (vehicles.length === 0) {
    <p class="empty-state">{{ t.order.noVehicleAvailable }}</p>
  } @else {
    <lib-vehicle-step
      [vehicles]="vehicles"
      [priceForVehicle]="priceForVehicle"
      [days]="days"
      (vehicleSelect)="ref.close($event)"
    />
  }
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>{{ t.common.cancel }}</button>
</mat-dialog-actions>
