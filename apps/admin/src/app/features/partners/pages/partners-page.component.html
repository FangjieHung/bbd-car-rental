<div>
  <ng-template appHeaderToolbar>
    <app-page-toolbar [showSearch]="false">
      <button actions mat-flat-button (click)="openForm(null)">{{ t.common.create }}</button>
    </app-page-toolbar>
  </ng-template>

  @if (store.partners().length === 0) {
    <p class="empty-state">{{ t.common.empty }}</p>
  } @else {
    <div class="ui-card !p-0">
      <lib-data-table
        [columns]="columns"
        [rows]="store.partners()"
        [labels]="labels"
        [emptyText]="t.common.empty"
        exportName="partners"
        (exportFailed)="onExportFailed($event)"
      >
        <ng-template dtCell="commission" let-p>
          {{ t.partner.commissionTypeLabels[p.commission.type] }}（{{ p.commission.value }}）
        </ng-template>
        <ng-template dtCell="actions" let-p>
          <button mat-button (click)="copyLink(p)">{{ t.partner.copyLink }}</button>
          <button mat-button (click)="openForm(p)">{{ t.common.edit }}</button>
          <button mat-button color="warn" (click)="remove(p)">{{ t.common.delete }}</button>
        </ng-template>
      </lib-data-table>
    </div>
  }
</div>
