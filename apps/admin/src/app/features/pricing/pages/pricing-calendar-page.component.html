<div>
  <form [formGroup]="calendarForm" (ngSubmit)="saveCalendar()" class="form-shell">
    <div class="form-shell ui-card">
      <h3 class="ui-text-subtitle">{{ t.pricing.holidays }}</h3>
      <div formArrayName="holidays">
        @for (range of holidays.controls; track $index) {
          <div [formGroupName]="$index" class="range-row">
            <mat-form-field>
              <mat-label>{{ t.pricing.start }}</mat-label>
              <input matInput type="date" formControlName="start" />
            </mat-form-field>
            <mat-form-field>
              <mat-label>{{ t.pricing.end }}</mat-label>
              <input matInput type="date" formControlName="end" />
            </mat-form-field>
            <button mat-button type="button" color="warn" (click)="removeHoliday($index)">
              {{ t.pricing.removeRange }}
            </button>
          </div>
        }
      </div>
      <button mat-button type="button" (click)="addHoliday()">{{ t.pricing.addRange }}</button>
    </div>

    <div class="form-shell ui-card">
      <h3 class="ui-text-subtitle">{{ t.pricing.peakSeasons }}</h3>
      <div formArrayName="peakSeasons">
        @for (range of peakSeasons.controls; track $index) {
          <div [formGroupName]="$index" class="range-row">
            <mat-form-field>
              <mat-label>{{ t.pricing.start }}</mat-label>
              <input matInput type="date" formControlName="start" />
            </mat-form-field>
            <mat-form-field>
              <mat-label>{{ t.pricing.end }}</mat-label>
              <input matInput type="date" formControlName="end" />
            </mat-form-field>
            <button mat-button type="button" color="warn" (click)="removePeakSeason($index)">
              {{ t.pricing.removeRange }}
            </button>
          </div>
        }
      </div>
      <button mat-button type="button" (click)="addPeakSeason()">{{ t.pricing.addRange }}</button>
    </div>

    <div class="actions">
      <button mat-flat-button type="submit" [disabled]="calendarForm.invalid">
        {{ t.pricing.saveCalendar }}
      </button>
    </div>
  </form>
</div>
