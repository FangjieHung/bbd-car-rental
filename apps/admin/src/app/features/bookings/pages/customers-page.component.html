<div>
  <ng-template appHeaderToolbar>
    <app-page-toolbar [showSearch]="false">
      <button actions mat-flat-button (click)="openForm(null)">{{ t.common.create }}</button>
    </app-page-toolbar>
  </ng-template>

  @if (store.customers().length === 0) {
    <p class="empty-state">{{ t.common.empty }}</p>
  } @else {
    <div class="ui-card !p-0">
      <lib-data-table
        [columns]="columns"
        [rows]="store.customers()"
        [labels]="labels"
        [emptyText]="t.common.empty"
        exportName="customers"
        (exportFailed)="onExportFailed($event)"
      >
        <ng-template dtCell="phone" let-c><span class="text-secondary">{{ c.phone }}</span></ng-template>
        <ng-template dtCell="idNumber" let-c
          ><span class="text-secondary">{{ c.idNumber ?? '—' }}</span></ng-template
        >
        <ng-template dtCell="note" let-c><span class="text-secondary">{{ c.note ?? '' }}</span></ng-template>
        <ng-template dtCell="actions" let-c>
          <button mat-button (click)="openForm(c)">{{ t.common.edit }}</button>
          <button mat-button color="warn" (click)="remove(c)">{{ t.common.delete }}</button>
        </ng-template>
      </lib-data-table>
    </div>
  }
</div>
